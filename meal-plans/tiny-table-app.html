<title>Tiny Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: phone-first single column, sticky app header, fixed bottom tab bar; goal colors are the pastel chips from the reference slides */
:root {
  --bg: #F8F8F1;
  --surface: #FFFFFF;
  --ink: #22261E;
  --muted: #62685A;
  --line: #E3E4D6;
  --accent: #2E6A4C;
  --accent-ink: #FFFFFF;
  --warn-bg: #FFF1D6;
  --warn-ink: #7A4B00;
  --good-bg: #E1F1E6;
  --good-ink: #1F5B3B;

  --g-brain: #F6D5D6;   --g-brain-ink: #8A2E3B;
  --g-iron: #CDE6DF;    --g-iron-ink: #1D5C4F;
  --g-pair: #FAE7A6;    --g-pair-ink: #664F00;
  --g-energy: #DCE6CB;  --g-energy-ink: #43582A;
  --g-bones: #E6DDEE;   --g-bones-ink: #57407A;
  --g-digest: #F9DDCD;  --g-digest-ink: #86401F;
  --g-variety: #D8E5F4; --g-variety-ink: #2C4E78;

  --f-display: "Sniglet", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141611; --surface: #1D2019; --ink: #ECEEE5; --muted: #A2A897; --line: #30352A;
    --accent: #7FC49F; --accent-ink: #10231A;
    --warn-bg: #3A2E14; --warn-ink: #F6D38A; --good-bg: #1D3326; --good-ink: #A8E0BF;
    --g-brain: #45282C; --g-brain-ink: #F5C4C8;
    --g-iron: #1E3B35; --g-iron-ink: #A9DCCF;
    --g-pair: #3D3414; --g-pair-ink: #F3DC87;
    --g-energy: #2D3622; --g-energy-ink: #CADDAE;
    --g-bones: #34293F; --g-bones-ink: #D9C8EA;
    --g-digest: #43291C; --g-digest-ink: #F4C7AD;
    --g-variety: #22324A; --g-variety-ink: #BCD3F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141611; --surface: #1D2019; --ink: #ECEEE5; --muted: #A2A897; --line: #30352A;
  --accent: #7FC49F; --accent-ink: #10231A;
  --warn-bg: #3A2E14; --warn-ink: #F6D38A; --good-bg: #1D3326; --good-ink: #A8E0BF;
  --g-brain: #45282C; --g-brain-ink: #F5C4C8;
  --g-iron: #1E3B35; --g-iron-ink: #A9DCCF;
  --g-pair: #3D3414; --g-pair-ink: #F3DC87;
  --g-energy: #2D3622; --g-energy-ink: #CADDAE;
  --g-bones: #34293F; --g-bones-ink: #D9C8EA;
  --g-digest: #43291C; --g-digest-ink: #F4C7AD;
  --g-variety: #22324A; --g-variety-ink: #BCD3F0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, .chipbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: 0.01em; }
.brand p { font-size: 0.85rem; color: var(--muted); }
.sync { font-size: 0.75rem; color: var(--muted); text-align: right; min-width: 0; }
.sync b { display: block; font-weight: 700; color: var(--ink); }

section.tab { display: grid; gap: 16px; padding-block: 16px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* summary */
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat .num { font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .lbl { font-size: 0.8rem; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

/* day picker */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto; min-width: 52px; padding: 8px 10px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  display: grid; justify-items: center; gap: 2px; font-size: 0.85rem;
}
.day .d { font-family: var(--f-display); font-size: 1rem; }
.day .dots { display: flex; gap: 2px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.day .dots i.on { background: var(--accent); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day[aria-pressed="true"] .dots i { background: color-mix(in srgb, var(--accent-ink) 35%, transparent); }
.day[aria-pressed="true"] .dots i.on { background: var(--accent-ink); }
.day .today { font-size: 0.65rem; letter-spacing: .06em; text-transform: uppercase; }

/* day head */
.dayhead { display: grid; gap: 8px; }
.dayhead h2 { font-size: 1.5rem; }
.phase { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; width: fit-content; }
.phase.fresh { background: var(--g-energy); color: var(--g-energy-ink); }
.phase.freezer { background: var(--g-variety); color: var(--g-variety-ink); }
.useup { font-size: 0.9rem; color: var(--muted); }
.useup b { color: var(--ink); }

.goalstrip { display: flex; flex-wrap: wrap; gap: 6px; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.75rem; font-weight: 700; line-height: 1;
  padding: 5px 9px; border-radius: 999px;
  background: var(--c, var(--line)); color: var(--ci, var(--ink));
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
.chip.off { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.chip.off::before { opacity: .35; }
.c-brain { --c: var(--g-brain); --ci: var(--g-brain-ink); }
.c-iron { --c: var(--g-iron); --ci: var(--g-iron-ink); }
.c-pair { --c: var(--g-pair); --ci: var(--g-pair-ink); }
.c-energy { --c: var(--g-energy); --ci: var(--g-energy-ink); }
.c-bones { --c: var(--g-bones); --ci: var(--g-bones-ink); }
.c-digestion { --c: var(--g-digest); --ci: var(--g-digest-ink); }
.c-variety { --c: var(--g-variety); --ci: var(--g-variety-ink); }

/* meals */
.meals { display: grid; gap: 10px; }
.meal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; display: grid; gap: 8px; min-width: 0;
}
.meal .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.meal .slot { font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.meal h3 { font-size: 1.15rem; }
.meal p.how { font-size: 0.92rem; color: var(--muted); }
.meal .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.meal.done { background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.meal.done h3 { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }

.tick {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1.5px solid var(--line); font-size: 0.85rem; font-weight: 700;
}
.tick .box { width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; }
.tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tick[aria-pressed="true"] .box { border-color: var(--accent-ink); background: var(--accent-ink); }
.tick[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 9px; border: solid var(--accent); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

.note { font-size: 0.85rem; padding: 8px 10px; border-radius: 10px; }
.note.good { background: var(--good-bg); color: var(--good-ink); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.tip { background: color-mix(in srgb, var(--line) 55%, transparent); color: var(--ink); }

.callout { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 4px; }
.callout b { font-family: var(--f-display); font-weight: 400; font-size: 1rem; }

/* shop */
.shophead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.group { display: grid; gap: 8px; }
.group h2 { font-size: 1.2rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.group h2 small { font-family: var(--f-body); font-size: 0.8rem; color: var(--muted); }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
  width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
  padding: 12px 14px; cursor: pointer;
}
.item:first-child { border-top: 0; }
.item .box { margin-top: 3px; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; }
.item[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.item[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.item .name { font-weight: 700; }
.item .amt { color: var(--muted); font-weight: 400; }
.item .keep { display: block; font-size: 0.82rem; color: var(--muted); }
.item[aria-pressed="true"] .name { text-decoration: line-through; color: var(--muted); }
.item:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

.ghost {
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 7px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
}
.ghost.arm { border-color: var(--warn-ink); color: var(--warn-ink); background: var(--warn-bg); }

/* plate */
.plate {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); z-index: 2;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; display: grid; gap: 10px; box-shadow: 0 6px 18px -12px rgba(0,0,0,.35);
  max-height: 45vh; overflow-y: auto;
}
.plate .onplate { font-family: var(--f-display); font-size: 1.1rem; }
.plate .onplate span { color: var(--muted); font-family: var(--f-body); font-size: 0.85rem; }
.plate .msgs { display: grid; gap: 6px; }
.fgroup { display: grid; gap: 8px; }
.fgroup h3 { font-size: 1rem; }
.foods { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn {
  padding: 8px 12px; border-radius: 999px; cursor: pointer; font-size: 0.9rem;
  background: var(--surface); border: 1.5px solid var(--line);
}
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* guide */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.goal .band { background: var(--c); color: var(--ci); padding: 12px 14px; display: grid; gap: 4px; }
.goal .band h2 { font-size: 1.25rem; }
.goal .band p { font-size: 0.9rem; }
.goal .body { padding: 12px 14px; display: grid; gap: 8px; font-size: 0.92rem; }
.goal .foods span { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.goal .inplan { color: var(--muted); }
.goal .inplan b { color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.card h2 { font-size: 1.25rem; }
.jobs { display: grid; gap: 6px; }
.job { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.job b { min-width: 84px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-weight: 700; width: 38%; }
ul.safe { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; font-size: 0.92rem; }
.credit { font-size: 0.8rem; color: var(--muted); text-align: center; }

/* prep */
.steps { display: grid; gap: 10px; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar .in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar button {
  background: none; border: 0; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 3px;
  font-size: 0.78rem; font-weight: 700; color: var(--muted);
}
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar .badge { font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Tiny Table</h1>
      <p>Week plan for a 1-year-old</p>
    </div>
    <div class="sync" id="sync"><b>Saved on this phone</b>checks stay here</div>
  </header>

  <section class="tab" id="tab-week" aria-label="Week"></section>
  <section class="tab" id="tab-shop" aria-label="Shopping list" hidden></section>
  <section class="tab" id="tab-plate" aria-label="Build a plate" hidden></section>
  <section class="tab" id="tab-guide" aria-label="Guide" hidden></section>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" id="t-week" data-tab="week" aria-selected="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week
    </button>
    <button role="tab" id="t-shop" data-tab="shop" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.3 10.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>Shop <span class="badge" id="shopbadge"></span></span>
    </button>
    <button role="tab" id="t-plate" data-tab="plate" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>Plate
    </button>
    <button role="tab" id="t-guide" data-tab="guide" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/></svg>Guide
    </button>
  </div>
</nav>

<script>
(() => {
  /* ---------- data ---------- */
  const GOALS = [
    { id: "brain", label: "Brain" },

  // tags: brain, iron, plant (plant iron), heme, vitc, energy, bones, fiber, bigdairy
  const FOODS = {

  const GROUPS = [

    { id: "legume", n: "Beans & lentils" },

    { id: "dairy", n: "Dairy" },
    { id: "fat", n: "Healthy fats" },

    { id: "veg", n: "Vegetables" },
  ];

  const SLOTS = { b: "Breakfast", s1: "Morning snack", l: "Lunch", s2: "Afternoon snack", d: "Dinner" };

  const PREP = [
    { id: "p1", h: "Mini beef meatballs", how: "Mix 1 lb ground beef, 1 egg, ¼ cup oats, a handful of thawed spinach and 1 grated carrot. Roll small balls and bake at 400°F for 15–18 min, until 160°F inside. Fridge half, freeze half." },
    { id: "p2", h: "Pot of red lentils", how: "Simmer 1 cup red lentils in 2½ cups water for 15–20 min until soft. Fridge half. Freeze the rest in an ice-cube tray." },

  const DAYS = [
    { id: "mon", n: "Monday", s: "Mon", phase: "fresh", useup: "ripe avocado, fresh lentils, bananas", meals: {
      b:  ["Berry oatmeal", "Oats made with water. Stir in mashed banana, thawed berries and a thin swirl of peanut butter.", ["oats", "banana", "berries", "nutbutter"]],

  /* ---------- state ---------- */
  const KEY = "tiny-table-v1";
  let state = { shop: {}, done: {} };

    if (raw) { const d = JSON.parse(raw); state = { shop: d.shop || {}, done: d.done || {} }; }
  } catch (e) {}

  let ref = null, saveTimer = null, saving = false, dirty = false;
  const syncEl = document.getElementById("sync");
  function setSync(mode) {
    syncEl.innerHTML = mode === "account"
      ? "<b>Saved to your account</b>checks follow you to any device"
      : "<b>Saved on this phone</b>checks stay here";
  }
  function changed() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (!ref) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 500);
  }
  async function flush() {
    saveTimer = null;
    if (saving || !ref) return;
    saving = true;
    let retried = false;
    while (dirty && ref) {
      dirty = false;
      try {
        await ref.set(JSON.parse(JSON.stringify(state)));
        setSync("account");
      } catch (e) {
        if (e && e.code === "unavailable" && !retried) {
          retried = true; dirty = true;
          await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
        } else {
          ref = null; setSync("device");
        }
      }
    }
    saving = false;
  }
  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      ref = db.doc("data/users/" + uid + "/state");
      ref.onSnapshot(snap => {
        if (saving || saveTimer || dirty || snap.metadata.hasPendingWrites) return;
        if (snap.exists) {
          const d = snap.data() || {};
          state = { shop: { ...(d.shop || {}) }, done: { ...(d.done || {}) } };
          try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
          renderAll();
        }
        setSync("account");
      }, () => { ref = null; setSync("device"); });
    } catch (e) { ref = null; }
  }

  /* ---------- helpers ---------- */
  function evalFoods(ids) {
    const tags = new Set(ids.flatMap(id => FOODS[id].t));
    const plant = tags.has("plant") && !tags.has("heme");
    return {
      brain: tags.has("brain"), iron: tags.has("iron"), energy: tags.has("energy"),
      bones: tags.has("bones"), digestion: tags.has("fiber"),
      pair: plant && tags.has("vitc"),
      pairMiss: plant && !tags.has("vitc"),
      dairyClash: tags.has("plant") && tags.has("bigdairy"),
      vitcFoods: ids.filter(id => FOODS[id].t.includes("vitc")),
      plantFoods: ids.filter(id => FOODS[id].t.includes("plant")),
      dairyFoods: ids.filter(id => FOODS[id].t.includes("bigdairy")),
      groups: new Set(ids.map(id => FOODS[id].g)),
    };
  }
  const names = ids => ids.map(id => FOODS[id].n.toLowerCase()).join(" and ");
  const chip = (id, label, off) => `<span class="chip c-${id}${off ? " off" : ""}">${label}</span>`;
  function goalChips(ev, showOff) {
    return GOALS.filter(g => showOff || ev[g.id])
      .filter(g => g.id !== "pair" || ev.plantFoods.length || !showOff || ev === plateEval)
      .map(g => chip(g.id, g.label, !ev[g.id])).join("");
  }
  let plateEval = null;
  function mealKey(day, slot) { return day + "-" + slot; }
  function todayId() { return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][new Date().getDay()]; }

  function armButton(btn, label, armedLabel, action) {
    let t = null;
    btn.addEventListener("click", () => {
      if (btn.classList.contains("arm")) {
        clearTimeout(t); btn.classList.remove("arm"); btn.textContent = label; action();
      } else {
        btn.classList.add("arm"); btn.textContent = armedLabel;
        t = setTimeout(() => { btn.classList.remove("arm"); btn.textContent = label; }, 3000);
      }
    });
  }

    }));
    return { eaten, total: DAYS.length * 5, tried: tried.size };
  }
  function dayEval(d) {

      if (ev.pairMiss) msgs.push(`<p class="note warn">Add a vitamin C food: kiwi, berries, red pepper or broccoli. The iron in the ${names(ev.plantFoods)} absorbs much better with it.</p>`);

        <div class="fgroup">
          <h3>${g.n}</h3>
          <div class="foods">${Object.entries(FOODS).filter(([, f]) => f.g === g.id).map(([id, f]) =>
            `<button class="chipbtn" data-food="${id}" aria-pressed="${plate.includes(id)}">${f.n}</button>`).join("")}</div>
        </div>`).join("")}`;
    plateEl.querySelectorAll(".chipbtn").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.food;
      plateIsExample = false;
      plate = plate.includes(id) ? plate.filter(x => x !== id) : plate.concat(id);
      renderPlate();
    }));
    plateEl.querySelector("#clearplate").addEventListener("click", () => { plate = []; plateIsExample = false; renderPlate(); });
  }

  /* ---------- guide ---------- */
  const guideEl = document.getElementById("tab-guide");
  function renderGuide() {
    guideEl.innerHTML = `
      <div>
        <p class="eyebrow">What a 1-year-old's plate needs</p>
        <h2 style="font-size:1.5rem">Seven goals, same few foods</h2>
      </div>
      ${GUIDE.map(g => `
        <article class="goal c-${g.id}">
          <div class="band"><h2>${g.h}</h2><p>${g.p}</p></div>
          <div class="body">
            <div class="foods">${g.foods.map(f => `<span>${f}</span>`).join("")}</div>
            <p class="inplan"><b>In this plan:</b> ${g.plan}</p>
          </div>
        </article>`).join("")}
      <div class="card">
        <h2>Balanced meals beat superfoods</h2>
        <p class="useup">You don't need a different food for every goal. The same foods do several jobs.</p>
        <div class="jobs">
          <div class="job"><b>Egg</b>${chip("pair", "protein")}${chip("pair", "choline")}${chip("pair", "fat")}</div>
          <div class="job"><b>Salmon</b>${chip("brain", "protein")}${chip("brain", "omega-3")}</div>
          <div class="job"><b>Beef</b>${chip("bones", "iron")}${chip("bones", "zinc")}${chip("bones", "protein")}</div>
          <div class="job"><b>Avocado</b>${chip("energy", "healthy fats")}${chip("energy", "energy")}</div>
          <div class="job"><b>Lentils</b>${chip("digestion", "iron")}${chip("digestion", "protein")}${chip("digestion", "fiber")}</div>
        </div>
      </div>
      <div class="card">
        <h2>About to go bad?</h2>
        <div class="tablewrap"><table>
          <tr><th>Brown bananas</th><td>Peel, halve and freeze. Use in pancakes and oatmeal.</td></tr>
          <tr><th>Half an avocado</th><td>Leave the pit in, add lemon juice and wrap tightly. Or mash and freeze in an ice-cube tray.</td></tr>
          <tr><th>Soft pears</th><td>Stew for 10 minutes and stir into oatmeal.</td></tr>
          <tr><th>Yogurt near its date</th><td>Freeze spoonfuls on a tray as a teething snack.</td></tr>
          <tr><th>Opened tofu or beans</th><td>Freeze what you won't use within 3 days.</td></tr>
          <tr><th>Leftovers on day 3</th><td>Freeze in ice-cube trays for ready-made baby portions.</td></tr>
          <tr><th>Extra cheese</th><td>Grate and freeze. It melts fine in quesadillas and pasta.</td></tr>
        </table></div>
      </div>
      <div class="card">
        <h2>Safety for a 1-year-old</h2>
        <ul class="safe">
          <li>Quarter round foods lengthwise: blueberries, grapes, meatballs, cherry tomatoes.</li>
          <li>Cook hard vegetables until soft. Steam or grate raw apple, pear and carrot.</li>
          <li>No whole nuts, popcorn or hard candy. Spread peanut butter thin, never by the spoonful.</li>
          <li>No added salt or sugar in baby's portion. Choose no-salt-added cans and rinse beans.</li>
          <li>Canned salmon and sardine bones are soft, but mash them well.</li>
          <li>Leftovers keep 3–4 days in the fridge at most. When in doubt, throw it out.</li>
          <li>Ask your pediatrician about allergies, vitamin D and anything specific to your child.</li>
        </ul>
      </div>
      <p class="credit">Goals adapted from @babyplate.app on TikTok.</p>`;
  }

  /* ---------- tabs ---------- */
  const TABS = ["week", "shop", "plate", "guide"];
  function showTab(t) {
    TABS.forEach(x => {
      document.getElementById("tab-" + x).hidden = x !== t;
      document.getElementById("t-" + x).setAttribute("aria-selected", String(x === t));
    });
    try { localStorage.setItem(KEY + "-tab", t); } catch (e) {}
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

  function renderAll() { renderWeek(); renderShop(); renderPlate(); }
  renderAll();
  renderGuide();

  let startTab = "week";
  const hash = (location.hash || "").replace("#", "");
  if (TABS.includes(hash)) startTab = hash;
  else { try { const t = localStorage.getItem(KEY + "-tab"); if (TABS.includes(t)) startTab = t; } catch (e) {} }
  showTab(startTab);

  connect();
})();
</script>

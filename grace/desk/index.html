<title>Grace's Creator Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-first column. Tabs on top, the sample "shipping label" card is the repeated unit. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --ink: #16202a; --muted: #5a6872; --line: #d5ddda;
  --accent: #b8174f; --accent-ink: #ffffff; --accent-soft: #fbe3ec;
  --good: #1b7556; --warn: #a35f00; --bad: #b3261e; --chip: #e3eae7;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1417; --surface: #182026; --ink: #e6ecef; --muted: #96a5ad; --line: #29343b;
  --accent: #f0699a; --accent-ink: #1b0710; --accent-soft: #3a1826;
  --good: #4fc79b; --warn: #f0a63a; --bad: #ff7b71; --chip: #212b31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1417; --surface: #182026; --ink: #e6ecef; --muted: #96a5ad; --line: #29343b;
  --accent: #f0699a; --accent-ink: #1b0710; --accent-soft: #3a1826;
  --good: #4fc79b; --warn: #f0a63a; --bad: #ff7b71; --chip: #212b31; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 80px; display: grid; gap: 18px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -.01em }
h2 { font-size: 1.2rem; font-weight: 800 }
h3 { font-size: 1rem; font-weight: 600 }
p { margin: 0 }
.muted { color: var(--muted) }
.mono, .label { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.label { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between }
header p { max-width: 52ch }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600 }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.ghost { background: transparent }
button:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0 }
textarea { resize: vertical; min-height: 84px; line-height: 1.45 }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5 }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px; color: var(--muted); white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.count { font-family: var(--f-mono); font-size: .72rem; background: var(--chip); border-radius: 99px; padding: 1px 7px; margin-left: 4px }

.banner { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .92rem }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px }
.pipeline span { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: .85rem }
.pipeline b { font-family: var(--f-mono); margin-right: 4px }

.list { display: grid; gap: 10px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0 }
.card .top { display: flex; gap: 12px; align-items: start; justify-content: space-between }
.card .top > div { min-width: 0 }
.card h3 { overflow-wrap: anywhere }
.slip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: .74rem; color: var(--muted); letter-spacing: .03em; border-top: 1px dashed var(--line); padding-top: 8px }
.slip .due-soon { color: var(--warn); font-weight: 600 }
.slip .overdue { color: var(--bad); font-weight: 600 }
.score { flex: none; text-align: center; min-width: 54px; border-radius: 10px; padding: 4px 6px; background: var(--chip) }
.score b { display: block; font-family: var(--f-display); font-size: 1.45rem; line-height: 1.1 }
.score small { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .08em; color: var(--muted) }
.score.hot { background: var(--accent); color: var(--accent-ink) } .score.hot small { color: inherit; opacity: .85 }
.why { display: flex; flex-wrap: wrap; gap: 5px }
.why span { font-size: .75rem; background: var(--chip); border-radius: 6px; padding: 2px 7px; color: var(--muted) }
.why span b { color: var(--ink); font-weight: 600 }
.actions { display: flex; flex-wrap: wrap; gap: 6px }
.actions button { padding: 5px 10px; font-size: .86rem }
.stage { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap }
.stage.picked, .stage.scripted { border-color: var(--accent); color: var(--accent) }
.stage.filmed { border-color: var(--warn); color: var(--warn) }
.stage.posted { border-color: var(--good); color: var(--good) }
.stage.skipped { opacity: .6 }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.filters button { border-radius: 99px; padding: 4px 11px; font-size: .85rem; font-weight: 500 }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.filters input { max-width: 220px; flex: 1 1 160px }

.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px 18px; display: grid; gap: 10px; justify-items: start }
.empty ol { margin: 0; padding-left: 20px; display: grid; gap: 4px }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.kpi b { display: block; font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.bars { display: grid; gap: 8px }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: .86rem }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden }
.bar .fill { height: 100%; background: var(--accent); border-radius: 99px }
.bar .val { font-family: var(--f-mono); font-size: .78rem; color: var(--muted) }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
table { border-collapse: collapse; width: 100%; font-size: .86rem; min-width: 720px }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500 }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 180px }
td { font-variant-numeric: tabular-nums }
tr.click { cursor: pointer } tr.click:hover td { background: var(--bg) }
.good { color: var(--good) } .weak { color: var(--muted) }

.session { display: grid; gap: 8px }
.session ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.session li { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap }

.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: end center; z-index: 20; padding-top: env(safe-area-inset-top, 0px) }
.sheet > div { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px }
@media (min-width: 700px) { .sheet { place-items: center } .sheet > div { border-radius: 16px } }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px }
.form .full { grid-column: 1 / -1 }
.form label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); min-width: 0 }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; display: grid; gap: 10px; min-width: 0 }
legend { font-family: var(--f-display); font-weight: 600; padding: 0 6px }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center }
.note { font-size: .8rem; color: var(--muted) }
.err { color: var(--bad); font-size: .85rem }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; box-shadow: 0 6px 18px rgb(0 0 0 / .18); border-radius: 99px; padding: 11px 18px }
@media (prefers-reduced-motion: no-preference) { .card, .kpi { transition: border-color .15s } }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="label">Samples in, videos out</p>
      <h1>Grace's Creator Desk</h1>
    </div>
    <p class="muted">Every sample gets a score. Film the top few each week, batch them by setting, and log each video's numbers so the scores learn what works for you.</p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-week" aria-selected="true" data-tab="week">This week</button>
    <button role="tab" id="t-samples" aria-selected="false" data-tab="samples">Samples<span class="count" id="c-samples">0</span></button>
    <button role="tab" id="t-shoot" aria-selected="false" data-tab="shoot">Shoot list<span class="count" id="c-shoot">0</span></button>
    <button role="tab" id="t-results" aria-selected="false" data-tab="results">Results<span class="count" id="c-videos">0</span></button>
  </nav>

  <main id="view"></main>
</div>
<button class="primary fab" id="addBtn">+ Add samples</button>
<div id="sheet" class="sheet" hidden><div id="sheetBody"></div></div>

<script>
// ---------- constants ----------
const STAGES = ["inbox", "picked", "scripted", "filmed", "posted", "skipped"];
const STAGE_NAME = { inbox: "Inbox", picked: "Picked", scripted: "Scripted", filmed: "Filmed", posted: "Posted", skipped: "Skipped" };
const CATEGORIES = ["Beauty & skincare", "Fashion", "Health & wellness", "Home & kitchen", "Tech & gadgets", "Food & drink", "Pets", "Kids & baby", "Other"];
const SETTINGS = ["Bathroom / vanity", "Closet / mirror", "Kitchen", "Desk / flat-lay", "Living room / couch", "Outdoors", "Car"];
const HOOKS = ["Problem call-out", "Result first", "Comment reply", "Curiosity gap", "Contrarian", "Price shock", "Visual pattern break", "POV", "Social proof", "Direct address"];
const FORMATS = ["Tips / tutorial", "Try-on", "Honest review", "Demo", "Unboxing", "Skit", "Combo cut"];
const EFFORT = { 1: "Easy (one take, one spot)", 2: "Medium", 3: "Hard (outfits, props, location)" };

// ---------- state ----------
let db = null, sample = null, canWrite = true;
let samples = [], videos = [], settings = { weeklyGoal: 3 };
let tab = "week", stageFilter = "open", search = "";
try { tab = localStorage.getItem("desk.tab") || "week" } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(String(v ?? "").replace(/[,$%\s]/g, "")); return Number.isFinite(n) && String(v ?? "").trim() !== "" ? n : null };
const fmt = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
const pct = (n, d = 2) => n == null ? "–" : (n * 100).toFixed(d) + "%";
const money = n => n == null ? "–" : "$" + (n >= 1000 ? fmt(n) : n.toFixed(n < 100 ? 2 : 0));
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()) };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseDay = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null };
const daysUntil = s => { const d = parseDay(s); return d ? Math.round((d - today()) / 864e5) : null };
const shortDate = s => { const d = parseDay(s); return d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "" };

// ---------- metrics ----------
function vStats(v) {
  const s = v.stats || {};
  const views = num(s.views), saves = num(s.saves), shares = num(s.shares), likes = num(s.likes), comments = num(s.comments);
  const earned = num(v.earned), orders = num(v.orders);
  return {
    views, saves, shares, likes, comments, earned, orders,
    saveRate: views ? (saves ?? 0) / views : null,
    shareRate: views ? (shares ?? 0) / views : null,
    perK: views && earned != null ? earned / views * 1000 : null,
  };
}
function categoryRecord() {
  // Average save rate and earnings per video, per category, from posted videos.
  const byId = Object.fromEntries(samples.map(s => [s.id, s]));
  const rec = {}, all = [];
  for (const v of videos) {
    const st = vStats(v); if (st.saveRate == null) continue;
    const cat = byId[v.sampleId]?.category || "Other";
    (rec[cat] ||= []).push(st); all.push(st);
  }
  const avg = a => a.reduce((x, y) => x + y.saveRate, 0) / a.length;
  return { rec, overall: all.length ? avg(all) : null, avg };
}

// Priority score, 0-100. Pure: takes a sample and the category record.
function scoreSample(s, record) {
  const parts = [];
  const price = num(s.price), units = num(s.unitsSold);
  // Price (30): a pricier product pays more per sale; $40+ = full
  let earn = 12, earnTxt = "no price yet";
  if (price != null) { earn = Math.min(1, price / 40) * 30; earnTxt = money(price) + " price" }
  parts.push(["Price", earn, earnTxt]);
  // Demand (25): lifetime units sold, log scale, 100k+ = full
  let dem = 10, demTxt = "units sold unknown";
  if (units != null) { dem = Math.min(1, Math.log10(units + 1) / 5) * 25; demTxt = fmt(units) + " sold" }
  parts.push(["Demand", dem, demTxt]);
  // Deadline (20)
  const dl = daysUntil(s.deadline); let due = 0, dueTxt = "no deadline";
  if (dl != null) { due = dl <= 3 ? 20 : dl <= 7 ? 13 : dl <= 14 ? 6 : 2; dueTxt = dl < 0 ? "overdue" : dl === 0 ? "due today" : "due in " + dl + "d" }
  parts.push(["Deadline", due, dueTxt]);
  // Track record (15): this category's save rate vs her overall
  let fit = 7.5, fitTxt = "no results in this category yet";
  const list = record.rec[s.category || "Other"];
  if (list && list.length >= 2 && record.overall) {
    const ratio = record.avg(list) / record.overall;
    fit = Math.max(0, Math.min(1, ratio / 2)) * 15;
    fitTxt = ratio >= 1.15 ? "your " + (s.category || "Other") + " videos do well" : ratio <= .85 ? "your " + (s.category || "Other") + " videos lag" : "average for you";
  }
  parts.push(["Fit", fit, fitTxt]);
  // Effort (10)
  const eff = Number(s.effort) || 2; parts.push(["Effort", eff === 1 ? 10 : eff === 2 ? 5 : 0, ["", "easy", "medium", "hard"][eff]]);
  return { total: Math.round(parts.reduce((a, p) => a + p[1], 0)), parts };
}

// ---------- rendering ----------
function setTab(t) {
  tab = t; try { localStorage.setItem("desk.tab", t) } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  render();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

function render() {
  const record = categoryRecord();
  for (const s of samples) s._score = scoreSample(s, record);
  $("#c-samples").textContent = samples.filter(s => s.stage !== "skipped" && s.stage !== "posted").length;
  $("#c-shoot").textContent = samples.filter(s => s.stage === "picked" || s.stage === "scripted").length;
  $("#c-videos").textContent = videos.length;
  const v = $("#view");
  v.innerHTML = tab === "samples" ? viewSamples() : tab === "shoot" ? viewShoot() : tab === "results" ? viewResults() : viewWeek();
  wire(v);
}

function sampleCard(s, opts = {}) {
  const sc = s._score, dl = daysUntil(s.deadline);
  const dueCls = dl == null ? "" : dl < 0 ? "overdue" : dl <= 3 ? "due-soon" : "";
  const nVideos = videos.filter(x => x.sampleId === s.id).length;
  const btn = [];
  if (s.stage === "inbox") btn.push(`<button data-act="stage" data-id="${s.id}" data-to="picked">Pick to film</button>`);
  if (s.stage === "picked" || s.stage === "scripted") btn.push(`<button data-act="script" data-id="${s.id}">${s.script ? "Open script" : "Script pack"}</button>`);
  if (s.stage === "picked" || s.stage === "scripted") btn.push(`<button data-act="stage" data-id="${s.id}" data-to="filmed">Filmed</button>`);
  if (s.stage === "filmed" || s.stage === "posted") btn.push(`<button data-act="video" data-id="${s.id}">+ Posted video</button>`);
  btn.push(`<button class="ghost" data-act="edit" data-id="${s.id}">Details</button>`);
  if (s.stage === "inbox" || s.stage === "picked") btn.push(`<button class="ghost" data-act="stage" data-id="${s.id}" data-to="skipped">Skip</button>`);
  if (s.stage === "skipped") btn.push(`<button class="ghost" data-act="stage" data-id="${s.id}" data-to="inbox">Back to inbox</button>`);
  return `<article class="card">
    <div class="top">
      <div>
        <h3>${esc(s.name)}</h3>
        <p class="muted">${esc([s.brand, s.category].filter(Boolean).join(" · ")) || "Add brand and category in Details"}</p>
      </div>
      <div class="score ${sc.total >= 60 ? "hot" : ""}" title="Priority score out of 100"><b>${sc.total}</b><small>SCORE</small></div>
    </div>
    ${opts.why ? `<div class="why">${sc.parts.map(p => `<span><b>${p[0]}</b> ${esc(p[2])}</span>`).join("")}</div>` : ""}
    <div class="actions">${canWrite ? btn.join("") : ""}</div>
    <div class="slip">
      <span class="stage ${s.stage}">${STAGE_NAME[s.stage] || s.stage}</span>
      ${s.received ? `<span>RCVD ${esc(shortDate(s.received))}</span>` : ""}
      ${s.deadline ? `<span class="${dueCls}">DUE ${esc(shortDate(s.deadline))}</span>` : ""}
      ${s.setting ? `<span>${esc(s.setting)}</span>` : ""}
      ${nVideos ? `<span>${nVideos} VIDEO${nVideos > 1 ? "S" : ""}</span>` : ""}
    </div>
  </article>`;
}

function emptyState() {
  return `<div class="empty">
    <h2>No samples logged yet</h2>
    <ol>
      <li>Tap <b>+ Add samples</b> and paste the boxes you have, one per line. Names are enough to start.</li>
      <li>Add price and units sold from the TikTok Shop listing when you have them. Those drive the score.</li>
      <li>Film the top picks, then log each posted video's link and numbers under <b>Results</b>.</li>
    </ol>
    ${canWrite ? `<button class="primary" data-act="add">+ Add samples</button>` : ""}
  </div>`;
}

function viewWeek() {
  if (!samples.length) return emptyState();
  const counts = Object.fromEntries(STAGES.map(st => [st, samples.filter(s => s.stage === st).length]));
  const open = samples.filter(s => ["inbox", "picked", "scripted"].includes(s.stage)).sort((a, b) => b._score.total - a._score.total);
  const goal = Number(settings.weeklyGoal) || 3;
  const top = open.slice(0, goal);
  const due = samples.filter(s => !["posted", "skipped"].includes(s.stage) && daysUntil(s.deadline) != null && daysUntil(s.deadline) <= 7)
    .sort((a, b) => daysUntil(a.deadline) - daysUntil(b.deadline));
  const weekAgo = iso(new Date(today() - 6 * 864e5));
  const postedWeek = videos.filter(v => (v.posted || "") >= weekAgo).length;
  return `<section style="display:grid;gap:14px">
    <div class="pipeline">${STAGES.filter(st => st !== "skipped").map(st => `<span><b>${counts[st]}</b>${STAGE_NAME[st]}</span>`).join("")}<span><b>${postedWeek}/${goal}</b>posted in the last 7 days</span></div>
    <div class="row">
      <h2>Film these next</h2>
      <label class="note" for="goal">Videos per week <input id="goal" type="number" min="1" max="21" value="${goal}" style="width:64px;display:inline-block;margin-left:6px" ${canWrite ? "" : "disabled"}></label>
    </div>
    <p class="muted">The ${goal} highest scores among samples you haven't filmed. Everything else can wait in the inbox. Skipping a box is fine.</p>
    <div class="list">${top.length ? top.map(s => sampleCard(s, { why: true })).join("") : `<p class="muted">Nothing waiting. Add samples or move one back from Skipped.</p>`}</div>
    ${due.length ? `<h2>Due within 7 days</h2><div class="list">${due.map(s => sampleCard(s)).join("")}</div>` : ""}
  </section>`;
}

function viewSamples() {
  if (!samples.length) return emptyState();
  const q = search.trim().toLowerCase();
  let list = samples.filter(s => stageFilter === "all" ? true : stageFilter === "open" ? !["posted", "skipped"].includes(s.stage) : s.stage === stageFilter);
  if (q) list = list.filter(s => [s.name, s.brand, s.category].join(" ").toLowerCase().includes(q));
  list.sort((a, b) => b._score.total - a._score.total);
  const f = ["open", ...STAGES, "all"];
  return `<section style="display:grid;gap:12px">

function groupBars(title, key, byId) {
  const g = {};
  for (const v of videos) {
    const st = vStats(v); if (st.saveRate == null) continue;
    const k = key === "category" ? (byId[v.sampleId]?.category || "Other") : (v[key] || "Not set");
    (g[k] ||= []).push(st);
  }
  const rows = Object.entries(g).map(([k, a]) => ({ k, n: a.length, sr: a.reduce((x, y) => x + y.saveRate, 0) / a.length, views: a.reduce((x, y) => x + (y.views || 0), 0) / a.length, earned: a.reduce((x, y) => x + (y.earned || 0), 0) }))
    .sort((a, b) => b.sr - a.sr);
  if (!rows.length) return "";
  const max = Math.max(...rows.map(r => r.sr)) || 1;
  return `<div class="card"><h3>${title}</h3><p class="label">Average save rate</p><div class="bars">${rows.map(r => `<div class="bar">
    <span>${esc(r.k)} <span class="muted">(${r.n})</span></span><span class="val">${pct(r.sr)} · ${fmt(r.views)} avg views${r.earned ? " · " + money(r.earned) : ""}</span>
    <div class="track"><div class="fill" style="width:${Math.max(3, r.sr / max * 100)}%"></div></div></div>`).join("")}</div></div>`;
}

function viewResults() {
  const byId = Object.fromEntries(samples.map(s => [s.id, s]));
  if (!videos.length) return `<div class="empty"><h2>No videos logged yet</h2><p class="muted">When a video goes up, open its sample, tap <b>+ Posted video</b> and paste the TikTok link. Ralph's Claude can fill in views, likes, comments, shares and saves from the link. Sales, watch time and % finished come from TikTok Studio, so add those yourself.</p></div>`;
  const since = iso(new Date(today() - 29 * 864e5));
  const recent = videos.filter(v => (v.posted || "") >= since).map(vStats);

    <div class="tablewrap"><table>
      <thead><tr><th>Video</th><th>Posted</th><th>Views</th><th>Save rate</th><th>Share rate</th><th>Finished</th><th>Orders</th><th>Earned</th><th>$ / 1k views</th><th>Stats from</th></tr></thead>
      <tbody>${rows.map(v => { const st = vStats(v), s = byId[v.sampleId]; return `<tr class="click" data-act="editvideo" data-vid="${v.id}" tabindex="0">
        <td><b>${esc(s?.name || "Unknown sample")}</b><br><span class="muted">${esc([v.hook, v.format].filter(Boolean).join(" · "))}</span></td>
        <td>${esc(shortDate(v.posted))}</td><td>${fmt(st.views)}</td>
        <td class="${st.saveRate >= .005 ? "good" : st.saveRate != null && st.saveRate < .001 ? "weak" : ""}">${pct(st.saveRate)}</td>
        <td>${pct(st.shareRate)}</td><td>${num(v.finishedPct) != null ? num(v.finishedPct) + "%" : "–"}</td>

        <td class="muted">${v.stats?.updated ? esc(shortDate(v.stats.updated.slice(0, 10))) + (v.stats.source === "claude" ? " · auto" : "") : "–"}</td></tr>` }).join("")}</tbody>
    </table></div>
  </section>`;
}

// ---------- interactions ----------
function wire(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    const act = el.dataset.act;
    const go = () => {
      if (act === "stage") setStage(el.dataset.id, el.dataset.to);
      else if (act === "edit") openSample(el.dataset.id);
      else if (act === "script") openScript(el.dataset.id);
      else if (act === "video") openVideo(null, el.dataset.id);
      else if (act === "editvideo") openVideo(el.dataset.vid);
      else if (act === "add") openAdd();
      else if (act === "filter") { stageFilter = el.dataset.f; render() }
    };
    el.addEventListener("click", go);
    if (el.tagName === "TR") el.addEventListener("keydown", e => { if (e.key === "Enter") go() });
  });
  const s = root.querySelector("#search");
  if (s) s.oninput = () => { search = s.value; const pos = s.selectionStart; render(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos) };
  const g = root.querySelector("#goal");
  if (g) g.onchange = () => { const n = Math.max(1, Math.min(21, Number(g.value) || 3)); settings.weeklyGoal = n; save("settings", "main", settings).then(render) };
}

async function save(col, id, body) {
  if (!db) { showBanner("Saving needs the claude.ai viewer. Open this page from its claude.ai link."); return false }
  try { await db.collection(col).doc(id).set(body); return true }
  catch (e) {
    if (e?.code === "invalid_argument" && canWrite !== false) { canWrite = false; showBanner("This page is view-only for you. Ask Ralph to share it with you as an Editor."); render() }
    else showBanner(e?.code === "quota_exceeded" ? "The tracker is full. Delete old skipped samples to make room." : "Couldn't save just now. Check your connection and try again.");
    return false;
  }
}
async function remove(col, id) { try { await db.collection(col).doc(id).delete() } catch (e) { showBanner("Couldn't delete just now. Try again.") } }
function strip(o) { const c = { ...o }; delete c.id; delete c._score; return c }
async function setStage(id, to) {
  const s = samples.find(x => x.id === id); if (!s) return;
  const body = strip(s); body.stage = to; body.updated = new Date().toISOString();
  if (to === "picked" && !s.picked) body.picked = iso(today());
  if (await save("samples", id, body)) { s.stage = to; render() }
}
function showBanner(t) { const b = $("#banner"); b.textContent = t; b.hidden = !t }

function openSheet(html, onReady) {

function closeSheet() { $("#sheet").hidden = true; $("#sheetBody").innerHTML = "" }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet() });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet() });

// Script pack
const RULES = `You write short TikTok Shop UGC scripts for a creator named Grace. Follow these house rules exactly:
- No personal-use lines ("I use it", "it worked for me", "it smells like...") unless Grace's own notes below say so. Review findings are "reviewers say", never her experience.
- No false scarcity ("selling out", "ends tonight"). "Don't put it off" or a real seasonal reason is fine.
- Product claims use the exact wording from the label/listing facts. Never "cures", "kills", "fixes"; no timeframe unless the facts give one.
- One honest caveat in every script, said calmly like a friend.
- Detached CTA that gives permission to scroll on, pointing to the orange cart.
- Never use: "you NEED this", "obsessed", "game changer", "miracle", "so cute", or reading off the size range.
- Hooks name a pain the viewer already has. Each hook has a spoken line AND short on-screen text, and must make sense with the sound off.
- Tips / tutorial angles ("watch this before you use it", "you're probably doing it wrong") beat hard sells.
- Speech is fast: about 30 words of hook, 60 of body, 20 of CTA. Write numbers as words.
- Product structure: hook (pain) -> clarity -> claim (exact wording) -> how to use (what / how / how often) -> caveat -> CTA.
- Fashion structure: hook (pain) -> fit facts (height, size, how it runs) -> proof (back turn, sit-down, sheer check) -> honest take (one love, one con) -> 3-5 looks -> price -> CTA.
- Never invent facts. If something the script needs is missing (fit, ingredients, directions, scent), put it under "Ask Grace" instead of guessing.`;
function scriptPrompt(s) {
  return `${RULES}

PRODUCT
Name: ${s.name}
Brand: ${s.brand || "unknown"}
Category: ${s.category || "unknown"}
Price: ${s.price ? "$" + s.price : "unknown"}
Label / listing facts: ${s.facts || "none given"}
Grace's own notes: ${s.notes || "none given"}

Write a script pack in plain text with these sections and nothing else:
HOOKS (4, each a different hook type; for each: type, spoken line, on-screen text)
BODY (one body that works after any hook)
CTA (one)
SHOTS (5-7 short shot lines Grace can film in one setup)
ASK GRACE (facts to confirm before filming; write "None" if nothing is missing)`;
}
function openScript(id) {
  const s = samples.find(x => x.id === id); if (!s) return;
  openSheet(`<div class="row"><h2>Script pack</h2><button class="ghost" data-close>Close</button></div>
    <p class="muted"><b>${esc(s.name)}</b>. 4 hooks, 1 body, 1 CTA, so one shoot cuts into several videos. Drafts use the listing facts and your notes from Details, and follow the house rules (no personal claims, exact label wording, one honest con).</p>
    ${!s.facts ? `<p class="banner">Add the label or listing facts in Details first, or the draft will mostly be questions.</p>` : ""}
    <div class="row"><span class="note" id="sc-status"></span><span class="actions"><button id="sc-stop" hidden>Stop</button><button id="sc-draft" ${sample ? "" : "hidden"}>${s.script ? "Redraft with Claude" : "Draft with Claude"}</button></span></div>
    <textarea id="sc-text" rows="16" placeholder="${sample ? "Tap Draft with Claude, or write the script here." : "Write or paste the script here."}">${esc(s.script)}</textarea>
    <div class="row"><span class="note">Read it once out loud before filming. Fix anything that isn't true for you.</span><button class="primary" id="sc-save">Save script</button></div>`, root => {
    const ta = root.querySelector("#sc-text"), st = root.querySelector("#sc-status"), draft = root.querySelector("#sc-draft"), stop = root.querySelector("#sc-stop");
    let ctl = null;
    draft.onclick = async () => {
      ctl = new AbortController(); draft.disabled = true; stop.hidden = false; st.textContent = "Thinking…";
      const before = ta.value;
      try {
        const { text, truncated } = await sample(scriptPrompt(s), { signal: ctl.signal, cache: false, onText: ({ text }) => { ta.value = text; st.textContent = "Writing…" } });
        ta.value = text; st.textContent = truncated ? "Cut short. Save what's useful and redraft." : "Draft ready. Edit, then save.";
      } catch (e) {
        if (e?.text) ta.value = e.text; else if (e?.code !== "cancelled") ta.value = before;
        st.textContent = e?.code === "cancelled" ? "Stopped." : e?.code === "rate_limited" ? "Claude is busy or your usage limit is reached. Try later." :
          ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code) ? "Drafting isn't available here. Write the script by hand." : "Something went wrong. Try again.";
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) { sample = null; draft.hidden = true }
      } finally { draft.disabled = false; stop.hidden = true }
    };
    stop.onclick = () => ctl?.abort();
    root.querySelector("#sc-save").onclick = async () => {
      const body = { ...strip(s), script: ta.value, updated: new Date().toISOString() };
      if (ta.value.trim() && (s.stage === "inbox" || s.stage === "picked")) body.stage = "scripted";
      if (await save("samples", s.id, body)) closeSheet();
    };
  });
}

  db.collection("samples").onSnapshot(q => { samples = q.docs.map(x => ({ id: x.id, ...x.data() })); render() }, () => showBanner("Lost the connection to saved data. Reload the page."));
  db.collection("videos").onSnapshot(q => { videos = q.docs.map(x => ({ id: x.id, ...x.data() })); render() }, () => {});
